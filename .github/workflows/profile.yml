name: Refresh profile visuals

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/github-snake.svg?color_snake=#00B67A&color_dots=#ebedf0,#b7ead2,#6fd3a8,#2bb57e,#0b8a5c
            snake/github-snake-dark.svg?palette=github-dark&color_snake=#3EE6A8&color_dots=#161b22,#0e3b2a,#11694a,#16a06c,#3ee6a8

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib snake
          git commit -m "Refresh profile visuals" || exit 0
          git push
